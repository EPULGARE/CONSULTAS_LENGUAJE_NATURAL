name: A1 baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUERY_ALLOW_EXECUTION: 'false'
  QUERY_DRY_RUN_DEFAULT: 'true'
  CATALOG_REQUIRE_APPROVAL: 'true'
  CONVERSATION_STORAGE_BACKEND: memory
  PYTHONUTF8: '1'

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Syntactic readiness only: these are not Oracle credentials.
      DB_DIALECT: oracle
      DB_HOST: localhost
      DB_SERVICE_NAME: CI_ONLY
      DB_USER: ci_readiness
      DB_PASSWORD: ci-not-a-real-password
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Prepare readiness environment file
        run: touch .env
      - name: Backend tests
        run: python -m pytest -q tests
      - name: Project readiness
        if: ${{ !cancelled() }}
        run: python -m scripts.project_readiness_check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  text-to-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Evaluate all governed questions (real OpenRouter, dry-run)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENROUTER_MODEL_SQL: google/gemini-2.5-flash
          OPENROUTER_MODEL_CLASSIFIER: google/gemini-2.5-flash
        run: >-
          python -m scripts.evaluate_text_to_sql
          --questions metadata/evaluation/questions.yml
          --output outputs/text_to_sql_evaluation.json
          --fail-on-error
      - name: Preserve evaluation report, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: text-to-sql-evaluation
          path: backend/outputs/text_to_sql_evaluation.json
          if-no-files-found: error
          retention-days: 7
