tables:
- full_name: SAC.CLI_FACTURACION
  description: 'Cabecera de facturacion por NIU/cuenta y consecutivo. Una fila representa
    una cabecera; su clave es CLIENTE_ID y CONSECUTIVO. Contiene numero de factura,
    fechas, totales y consumos. Para contar cabeceras usar COUNT(*). El detalle referencia
    ambas columnas mediante FK declarada; esa union compuesta aun no esta habilitada
    en el catalogo de relaciones. No sustituir CONSECUTIVO por CONS_NRO_FAC. Las fechas
    NUMBER conservan su valor numerico: su codificacion no se ha validado. No sumar
    TOTAL_FACTURADO despues de multiplicar cabeceras por detalles.'
  domain_suggested: facturas
  synonyms:
  - cabecera de facturacion
  - cabeceras de facturacion
  - numero de factura
  - total facturado
  - vencimiento de factura
