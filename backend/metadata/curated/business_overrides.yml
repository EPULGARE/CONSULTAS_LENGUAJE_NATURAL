      ANTIG_SALDO:
        business_description: Antiguedad de Saldo del cliente al momento de liquidar
        allowed_for_select: true
      TOT_INTERESES:
        business_description: Valor de los Intereses facturados
        allowed_for_select: true
      CENTRO_POB:
        business_description: Centro Poblado del cliente [V_CENPOB]
        allowed_for_select: true
      CLAVE_LECTURA:
        business_description: Observacion de Lectura
