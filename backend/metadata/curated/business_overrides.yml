      TIPO_SERVICIO:
        business_description: Servicio relacionado al cliente. [TIPO_SERVICIO]
        allowed_for_select: true
      TIPO_FACTURACION:
        business_description: "Tipo de Facturaci\xF3n. S-Sitio, O-Oficina."
        allowed_for_select: true
      OPERADOR_RED:
        business_description: Operador de red que cubre el area donde se ubica el transformador
        allowed_for_select: true
      NUMERO_FACTURA_CAR:
        business_description: SIN EVIDENCIA SUFICIENTE
        allowed_for_select: false
      PERIODICIDAD:
        business_description: "Indica la periodicidad de lectura utilizada al momento\
          \ de la liquidaci\xF3n del cliente"
        allowed_for_select: true
      FECHA_PRELIQUIDACION:
        business_description: Fecha en la que se pre-liquida un ciclo de FENS
        allowed_for_select: true
      CLIENTE_ID_AGRUPA:
        business_description: "Identificador de agrupaci\xF3n de clientes en el sistema"
        allowed_for_select: true
      CONSECUTIVO_AGRUPA:
        business_description: "Consecutivo de agrupaci\xF3n de facturacion"
        allowed_for_select: true
      CONDICION_ESPECIAL:
        business_description: SIN EVIDENCIA SUFICIENTE
        allowed_for_select: false
      NIT:
        business_description: SIN EVIDENCIA SUFICIENTE
        allowed_for_select: false
      FACTOR_COMUN:
        business_description: "Factor asociado al cliente que pertenece a una agrupaci\xF3\
          n"
        allowed_for_select: true
      CONSUMO_EXP_COMUN:
        business_description: "Consumo exportado que le corresponde al cliente que pertenece\
          \ a una agrupaci\xF3n"
        allowed_for_select: true
  SAC.V_AC_PROCESOS:
    business_description: 'Vista de acciones individuales de cada proceso. USER_SISTEMA
      identifica al trabajador que termino la accion; no al cliente. Un proceso puede
      tener varias acciones: para contar procesos usar COUNT(DISTINCT NUMERO_PROCESO). Para contar acciones de esta vista usar COUNT(*), no contar procesos distintos.'
    synonyms:
    - acciones
    - accion
    - acciones individuales
    - acciones de procesos
    - trabajador
    - trabajadores
    - usuario del sistema
    - user_sistema
    - respuesta
    - respuestas
    domain: procesos
    example_questions:
    - acciones de procesos por trabajador y mes
    - respuestas de procesos por usuario del sistema
    - numero de proceso y acciones realizadas por trabajador
    columns:
      NUMERO_PROCESO:
        business_description: Numero del proceso al que pertenece la accion; se une
          con SAC.PROCESOS.NUMERO_PROCESO. Puede repetirse para distintas acciones.
      D_ACCION:
        business_description: Descripcion de la accion individual; el ejemplo busca
          descripciones que contienen Respuesta.
      ESTADO:
        business_description: Codigo de estado de la accion. El SQL aportado filtra
          F. El usuario confirma que F significa accion cerrada. Aplicar este filtro solo cuando se soliciten acciones cerradas.
      FECHA_SISTEMA:
        business_description: Fecha de sistema de la accion; el SQL aportado la utiliza
          para agrupar por mes. El usuario confirma esta columna para filtrar el periodo de acciones cerradas; no usar FECHA_FIN.
      USER_SISTEMA:
        business_description: Usuario del sistema del trabajador que termino la accion,
          segun definicion del usuario. No representa al cliente ni al responsable asignado.
  SAC.PROCESOS:
    business_description: Procesos, tramites, solicitudes y PQR asociados a clientes. FECHA_SOL es la fecha de creacion del proceso; usarla para procesos creados hoy o en un periodo.
    synonyms:
      - proceso
      - procesos
      - tramite
      - tramites
      - pqr
      - solicitud
      - solicitudes
      - procesos realizados
      - proceso realizado
      - numero de proceso
    domain: procesos
    example_questions:
      - numero de proceso y proceso realizado por cliente_id
      - procesos realizados por el cliente_id 142518
      - numero de proceso por cliente
      - cantidad de procesos con codigo de proceso 4601 que se crearon hoy
    columns:
      NUMERO_PROCESO:
        business_description: Identificador unico del proceso o tramite.
      FECHA_SOL:
        # Significado confirmado expresamente por el usuario el 2026-09-21.
        business_description: Fecha de creacion del proceso. Usar para creacion, procesos creados, registrados o que se crearon en una fecha o periodo. Para hoy usar FECHA_SOL >= TRUNC(SYSDATE) AND FECHA_SOL < TRUNC(SYSDATE) + 1. No sustituir por FECHA_SISTEMA ni inventar FECHA_CREACION.
      PROCESO:
        business_description: Codigo del proceso realizado. Usar para proceso 4601 o codigo de proceso; no usar para tipo de proceso, que corresponde a TIPO.
      TIPO:
        business_description: Tipo de proceso. Cuando el usuario solicita procesos tipo 46 o tipo de proceso 46, filtrar TIPO = '46', no PROCESO. Es VARCHAR2 y el codigo se expresa entre comillas.
      CLIENTE_ID:
        business_description: Identificador del cliente asociado directamente al proceso.
      CODIGO_CUENTA:
        business_description: Codigo de cuenta del proceso; no usar como cliente_id salvo que el usuario pida codigo cuenta.
