questions:
  - id: "cuantos_medidores_por_municipio"
    domain: "medidores"
    question: "Cuantos medidores hay por municipio"
    expected_tables:
      - "SAC.MEDIDORES"
      - "SAC.CLIENTES"
      - "SAC.MUNICIPIOS"
    forbidden_tables:
      - "SAC.MULTITABLA"
    expected_columns:
      - "MUNICIPIOS.DESCRIPCION"
    forbidden_columns: []
    expected_sql_contains:
      - "COUNT("
      - "SAC.MEDIDORES"
      - "SAC.CLIENTES"
      - "SAC.MUNICIPIOS"
    forbidden_sql_contains:
      - "SELECT *"
    notes: "Debe usar cadena MEDIDORES -> CLIENTES -> MUNICIPIOS."
    approved: true

