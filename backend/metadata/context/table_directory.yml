- table: SAC.V_AC_PROCESOS
  domain: procesos
  short_description: 'Vista de acciones individuales de cada proceso. USER_SISTEMA
    identifica al trabajador que termino la accion; no al cliente. Un proceso puede
    tener varias acciones: para contar procesos usar COUNT(DISTINCT NUMERO_PROCESO).
    Para contar acciones de esta vista usar COUNT(*), no contar procesos distintos.'
  keywords:
  - acciones
  - accion
  - acciones individuales
  - acciones de procesos
  - trabajador
  - trabajadores
  - usuario del sistema
  - user_sistema
  - respuesta
  - respuestas
  business_terms:
  - acciones de procesos por trabajador y mes
  - respuestas de procesos por usuario del sistema
  - numero de proceso y acciones realizadas por trabajador
  allowed_for_query: true
  context_path: metadata/context/tables/SAC.V_AC_PROCESOS.yml
