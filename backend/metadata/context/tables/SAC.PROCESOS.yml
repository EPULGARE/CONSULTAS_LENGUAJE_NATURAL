table: SAC.PROCESOS
domain: procesos
business_description: Procesos, tramites, solicitudes y PQR asociados a clientes.
  FECHA_SOL es la fecha de creacion del proceso; usarla para procesos creados hoy
  o en un periodo.
display_column: ''
columns:
- name: NUMERO_PROCESO
  type: NUMBER
  business_description: Identificador unico del proceso o tramite.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: ''
- name: TIPO
  type: VARCHAR2
  business_description: Tipo de proceso. Cuando el usuario solicita procesos tipo
    46 o tipo de proceso 46, filtrar TIPO = '46', no PROCESO. Es VARCHAR2 y el codigo
    se expresa entre comillas.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: ''
- name: PROCESO
  type: VARCHAR2
  business_description: Codigo del proceso realizado. Usar para proceso 4601 o codigo
    de proceso; no usar para tipo de proceso, que corresponde a TIPO.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: ''
- name: CODIGO_CUENTA
  type: NUMBER
  business_description: Codigo de cuenta del proceso; no usar como cliente_id salvo
    que el usuario pida codigo cuenta.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: ''
- name: SOLICITANTE
  type: NUMBER
  business_description: 'TODO: describir uso de negocio'
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: ''
- name: FECHA_SOL
  type: DATE
  business_description: Fecha de creacion del proceso. Usar para creacion, procesos
    creados, registrados o que se crearon en una fecha o periodo. Para hoy usar FECHA_SOL
    >= TRUNC(SYSDATE) AND FECHA_SOL < TRUNC(SYSDATE) + 1. No sustituir por FECHA_SISTEMA
    ni inventar FECHA_CREACION.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: ''
