table: SAC.CLI_FACTURACION
domain: facturas
business_description: 'Cabecera de facturacion por NIU/cuenta y consecutivo. Una fila
  representa una cabecera; su clave es CLIENTE_ID y CONSECUTIVO. Contiene numero de
  factura, fechas, totales y consumos. Para contar cabeceras usar COUNT(*). El detalle
  referencia ambas columnas mediante FK declarada; esa union compuesta aun no esta
  habilitada en el catalogo de relaciones. No sustituir CONSECUTIVO por CONS_NRO_FAC.
  Las fechas NUMBER conservan su valor numerico: su codificacion no se ha validado.
  No sumar TOTAL_FACTURADO despues de multiplicar cabeceras por detalles.'
display_column: ''
columns:
- name: CLIENTE_ID
  type: NUMBER
  business_description: NIU / cuenta de la cabecera de facturacion. Parte de la clave
    primaria junto con CONSECUTIVO.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: Codigo que identifica el cliente en el sistema
- name: CONSECUTIVO
  type: NUMBER
  business_description: Consecutivo de facturacion dentro del NIU/cuenta. Junto con
    CLIENTE_ID identifica una cabecera; no es unico globalmente ni identifica un cargo
    individual.
  selectable: true
  sensitive: false
  synonyms: []
  comments_auxiliary: Consecutivo de facturacion
- name: NUMERO_FACTURA
  type: VARCHAR2
  business_description: Numero de factura segun Oracle. Admite NULL; no tiene unicidad
    declarada y no sustituye la clave CLIENTE_ID + CONSECUTIVO.
